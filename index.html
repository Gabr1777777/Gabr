<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galeria Profissional WRS</title>
    <style>
        :root {
            --neon-blue: #0048FF;
            --bg-dark: #050505;
            --card-bg: rgba(17, 17, 17, 0.5);
            --deep-blue-bar: rgba(0, 10, 31, 0.5); 
        }

        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior-y: contain; 
            background-color: #000;
        }

        /* BARRA DE ROLAGEM ESTILO XAT */
        ::-webkit-scrollbar { width: 8px; height: 0px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.5); }
        ::-webkit-scrollbar-thumb { 
            background: var(--neon-blue); 
            border-radius: 10px; 
            box-shadow: 0 0 10px var(--neon-blue); 
        }

        /* EFEITO CURSOR ESTRELA */
        .cursor-star {
            position: absolute; background: #fff; width: 4px; height: 4px; border-radius: 50%; pointer-events: none; z-index: 1000002;
            box-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-blue);
            animation: trailFade 0.7s linear forwards;
        }
        @keyframes trailFade { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.2); opacity: 0; } }

        /* BARRA DE LETREIRO PRETA */
        .marquee-container-new {
            background: #000;
            width: 100%;
            overflow: hidden;
            padding: 12px 0;
            margin: 10px 0;
            border-top: 2px solid #111;
            border-bottom: 2px solid #111;
        }
        .marquee-inner-new {
            display: flex;
            width: max-content;
            animation: scroll-marquee 25s linear infinite;
        }
        .marquee-text-new {
            font-family: 'Arial Black', sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding-right: 80px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff00ea, #00d4ff, #ff7300, #ff00ea);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer-text 3s linear infinite;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        @keyframes scroll-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes shimmer-text { to { background-position: 200% center; } }

        /* ESTRUTURA BASE */
        body { 
            background-image: url('https://i.imgur.com/iWVWXg2.gif'); 
            background-attachment: fixed; 
            background-size: cover; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        .perfil-header { text-align: center; padding: 15px; border-bottom: 2px solid var(--neon-blue); background: rgba(5, 5, 5, 0.7); }
        .perfil-header h1 { 
            font-size: 2rem; margin: 0; 
            background: linear-gradient(-45deg, #0048FF, #ffffff, #0048FF);
            background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer-text 4s linear infinite;
        }

        .main-wrapper { display: flex; height: calc(100vh - 100px); overflow: hidden; }
        .nav-container { width: 230px; padding: 15px; background: rgba(0,0,0,0.5); border-right: 1px solid var(--neon-blue); overflow-y: auto; }
        .content-area { flex: 1; padding: 20px; overflow-y: auto; position: relative; }

        .nav-btn { 
            background: var(--deep-blue-bar); border: 1px solid #00268a; padding: 12px; cursor: pointer; 
            color: white; width: 100%; text-align: left; margin-bottom: 8px; text-transform: uppercase; 
            font-weight: bold; transition: 0.3s;
        }
        .nav-btn:hover, .nav-btn.active { border-color: var(--neon-blue); background: rgba(0, 72, 255, 0.3); box-shadow: 0 0 15px var(--neon-blue); }

        .section { display: none; }
        .section.active { display: block; }

        .grid-container { display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); padding: 10px 0; }
        .card { background: var(--card-bg); border: 1px solid #222; border-radius: 4px; overflow: hidden; cursor: zoom-in; transition: 0.3s; }
        .card:hover { border-color: var(--neon-blue); transform: translateY(-5px); box-shadow: 0 0 20px var(--neon-blue); }
        .card img { width: 100%; display: block; }
        .card .label { padding: 6px; font-size: 11px; text-align: center; background: rgba(0,0,0,0.8); font-weight: bold; }

        #intro-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://i.imgur.com/4kRbv63.gif') center/cover; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 1s; }
        .moldura-flutuante { position: relative; width: 260px; height: 260px; border: 3px solid var(--neon-blue); border-radius: 15px; box-shadow: 0 0 30px var(--neon-blue); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        #modalZoom { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="intro-screen">
        <div class="moldura-flutuante"><img src="https://i.imgur.com/hqDqtpe.gif" style="width:100%"></div>
        <button class="nav-btn" style="width: auto; padding: 15px 50px; margin-top: 30px; font-size: 18px;" onclick="entrarGaleria()">Entrar na Galeria</button>
    </div>

    <div class="perfil-header">
        <h1>GALERIA EXCLUSIVA WRS</h1>
        <p style="margin: 5px 0 0; font-weight: bold; letter-spacing: 2px;">BY: GABR (1777777)</p>
    </div>

    <div class="main-wrapper">
        <div class="nav-container">
            <button class="nav-btn active" onclick="showTab('inicio')">Início</button>
            <button class="nav-btn" onclick="showTab('gifs')">GIFS</button>
            <button class="nav-btn" onclick="showTab('pcback-gif')">PCBACK GIFS</button>
            <button class="nav-btn" onclick="showTab('pstyle-gif')">PSTYLE GIFS</button>
            <button class="nav-btn" onclick="showTab('pcback-est')">PCBACK ESTÁTICO</button>
            <button class="nav-btn" onclick="showTab('pstyle-est')">PSTYLE ESTÁTICO</button>
            <button class="nav-btn" onclick="showTab('fundos')">FUNDOS</button>
        </div>

        <div class="content-area">
            <div id="inicio" class="section active">
                <div style="background: rgba(0,0,0,0.6); padding: 25px; border-radius: 8px; border: 1px solid var(--neon-blue);">
                    <h2 style="color: var(--neon-blue); margin-top: 0;">Sobre a Galeria</h2>
                    <p>Vendo Gifs, Pcback, Pstyle e Fundos para XAT.</p>
                    <p><b>Clique em qualquer imagem para ampliar.</b></p>
                </div>
            </div>

            <div id="gifs" class="section"></div>
            <div id="pcback-gif" class="section"></div>
            <div id="pstyle-gif" class="section"></div>
            <div id="pcback-est" class="section"></div>
            <div id="pstyle-est" class="section"></div>
            <div id="fundos" class="section"></div>
        </div>
    </div>

    <div id="modalZoom" onclick="this.style.display='none'">
        <img id="imgZoom" style="max-width:90%; max-height:90%; border:2px solid var(--neon-blue); box-shadow: 0 0 50px var(--neon-blue);">
    </div>

    <script>
        document.addEventListener('mousemove', e => {
            const s = document.createElement('div'); s.className = 'cursor-star';
            s.style.left = e.pageX+'px'; s.style.top = e.pageY+'px';
            document.body.appendChild(s); setTimeout(()=>s.remove(), 700);
        });

        function entrarGaleria() {
            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            setTimeout(() => intro.style.display = 'none', 1000);
        }

        function showTab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function openZoom(src) { 
            document.getElementById('imgZoom').src = src; 
            document.getElementById('modalZoom').style.display = 'flex'; 
        }

        function render() {
            const configs = [
                { 
                    id: 'pcback-gif', marquee: "✧ Pcback Gif - 450 Xats ✧", label: "PCBack Gif", 
                    urls: [
                        'SFnk7A6.gif', 'KKY2zqU.gif', 'fmhynyY.gif', '28xDTg0.gif', '9R35WMu.gif', 'kSK0E1f.gif', 'l2y5xFa.gif', 'ZDbAiNK.gif', 'fRmpR5e.gif', 'TUdO2r8.gif',
                        'clgE48o.gif', 'gWgkiku.gif', 'vS55bUO.gif', 'Xib4qKf.gif', 'pcGjNGM.gif', 'n4JMxfr.gif', 'XrJTb1e.gif', 'dyvcHuK.gif', 'l8jI2ia.gif', 'UlnuUQG.gif',
                        'opekB2r.gif'
                    ] 
                },
                { 
                    id: 'pstyle-gif', marquee: "✧ Pstyle Gif - 350 Xats ✧", label: "Pstyle Gif", 
                    urls: [
                        'rUIzfWU.gif', 'dGfJDfh.gif', 'ZXBA6F1.gif', 'dImC226.gif', '4P6kTS6.gif', 'E6fZa1k.gif', 'iaCw0P8.gif', '3mC3Qgh.gif', 'jSyWPEs.gif', 'vLnBaqA.gif',
                        'LmDTRY5.gif', 'PhxEvbL.gif', '1pMwbMm.gif', '7KedrNM.gif', 'yqLPTKa.gif', 'FoW5FXN.gif', 'vWDVot8.gif', 'RJHbbfm.gif'
                    ] 
                },
                { 
                    id: 'pcback-est', marquee: "✧ Pcback Estático - 300 Xats ✧", label: "PCBack", 
                    urls: [
                        'OyX4Jwt.png', 'dbSy2Rf.png', 'uBp1ypU.png', '83Glu7j.png', 'QtSYA09.png', 'WDKosnm.png', 'WfVIivT.png', 'ojcJMIb.png', 'Dn05p8R.png', '5iJRrrF.png',
                        'uBp1ypU.png', '98FssR8.png'
                    ] 
                },
                { 
                    id: 'pstyle-est', marquee: "✧ Pstyle Estático - 250 Xats ✧", label: "Pstyle", 
                    urls: [
                        'Ii4pk4g.png', 'm2Ew85b.png', 'zlcL7Dh.png'
                    ] 
                },
                { 
                    id: 'fundos', marquee: "✧ Fundos - 500 Xats ✧", label: "FUNDO", 
                    urls: [
                        'eJtGG3D.png', 'Q8XwtQZ.png', '6phSrhR.png', 'yeQZf5S.png', 'RDsR3k5.png', 'EXCVWDO.png', 'umcaiMq.png', 'hzjUj8q.png', 'zQj5X8P.png', 'OojsaCj.png',
                        'EHK0Ik0.png', 'sSfzBLf.png', 'J6tAgOm.png', 'hqxUYUr.png'
                    ] 
                }
            ];

            configs.forEach(c => {
                const target = document.getElementById(c.id);
                if (target) {
                    let html = `<div class="marquee-container-new"><div class="marquee-inner-new">
                                <span class="marquee-text-new">${c.marquee}</span>
                                <span class="marquee-text-new">${c.marquee}</span>
                                <span class="marquee-text-new">${c.marquee}</span>
                                </div></div><div class="grid-container">`;
                    c.urls.forEach((img, i) => {
                        html += `<div class="card" onclick="openZoom('https://i.imgur.com/${img}')">
                                 <img src="https://i.imgur.com/${img}"><div class="label">${c.label} - ${i+1}</div></div>`;
                    });
                    target.innerHTML = html + `</div>`;
                }
            });

            // GIFS ESPECIAIS
            const gifSec = document.getElementById('gifs');
            const specialData = [
                { marquee: "✧ Blufftitler - Only Name - 250 Xats ✧", prefix: "Name", 
                    ids: ["bidwh1D", "wR2NpTV", "IMrOUcP", "Hdi04Sg", "OcGaTXA", "wJZiwkG", "jDgxhBQ", "USQgVk8", "4bhAWa5", "0LL3muu"] 
                },
                { marquee: "✧ PhotoScape - Parpadeo - 100~300 Xats ✧", prefix: "Parpadeo", 
                    ids: ["bXTTG5V", "MdemxH0", "VpU6eOY", "NUIGQ3f", "NP25oCb", "mXHqKwc", "bKcj9xf"] 
                }
            ];

            specialData.forEach(s => {
                let h = `<div class="marquee-container-new"><div class="marquee-inner-new">
                            <span class="marquee-text-new">${s.marquee}</span>
                            <span class="marquee-text-new">${s.marquee}</span>
                         </div></div><div class="grid-container">`;
                s.ids.forEach((id, i) => {
                    h += `<div class="card" onclick="openZoom('https://i.imgur.com/${id}.gif')">
                            <img src="https://i.imgur.com/${id}.gif"><div class="label">${s.prefix} - ${i+1}</div></div>`;
                });
                gifSec.innerHTML += h + `</div>`;
            });
        }
        window.onload = render;
    </script>
</body>
</html>
