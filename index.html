<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Profissional WRS - Consolidada</title>
    <style>
        :root {
            --neon-blue: #0048FF;
            --bg-dark: #050505;
            --card-bg: rgba(17, 17, 17, 0.5);
            --deep-blue-bar: rgba(0, 10, 31, 0.5); 
            --silver: #C0C0C0;
        }

        /* RESET E BASE */
        body {
            background-image: url('https://i.imgur.com/iWVWXg2.gif');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* PERSONALIZAÇÃO DAS BARRAS DE ROLAGEM */
        ::-webkit-scrollbar { width: 8px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; box-shadow: 0 0 10px var(--neon-blue); }

        /* ESTILOS DO EFEITO DO CURSOR (ESTRELAS) */
        .cursor-star {
            position: absolute;
            background: #fff;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000002;
            box-shadow: 0 0 5px #fff, 0 0 20px var(--neon-blue);
            animation: trailFade 0.7s linear forwards;
        }
        @keyframes trailFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.2); opacity: 0; }
        }

        /* CABEÇALHO */
        .perfil-header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid var(--neon-blue);
            background: rgba(5, 5, 5, 0.7);
            z-index: 10;
            flex-shrink: 0;
        }
        .perfil-header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(-45deg, var(--neon-blue), #fff, var(--neon-blue), #fff);
            background-size: 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveGradient 4s linear infinite;
        }

        /* MAIN WRAPPER E NAVEGAÇÃO */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; position: relative; }

        .nav-container {
            width: 250px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-right: 1px solid var(--neon-blue);
            z-index: 20;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.5s ease;
        }

        .nav-btn {
            background: var(--deep-blue-bar);
            border: 1px solid rgba(0, 38, 138, 0.5);
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            color: white;
            transition: 0.3s;
            text-align: left;
        }
        .nav-btn:hover, .nav-btn.active {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            background: rgba(0, 72, 255, 0.3);
            transform: translateX(8px);
        }

        /* ÁREA DE CONTEÚDO */
        .content-area { flex: 1; padding: 30px; overflow-y: auto; z-index: 15; position: relative; }

        /* GALERIA MOBILE (HORIZONTALE) */
        .mobile-scroll {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 0;
            -webkit-overflow-scrolling: touch;
        }
        .mobile-scroll .card { flex: 0 0 auto; width: 150px; }

        /* CARDS E GRIDS */
        .grid-container { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(34, 34, 34, 0.5);
            border-radius: 8px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }
        .card:hover { border-color: var(--neon-blue); transform: scale(1.05); box-shadow: 0 0 20px var(--neon-blue); }
        .card img { width: 100%; display: block; image-rendering: auto; }
        .card .label { padding: 8px; font-size: 11px; text-align: center; background: rgba(0,0,0,0.8); font-weight: bold; }

        /* CONTADOR (POSICIONADO POR BAIXO NO MOBILE) */
        #visit-counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1; /* Mantém por baixo dos menus flutuantes se houver */
            background: rgba(5, 5, 5, 0.8);
            border: 1px solid var(--neon-blue);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* PLAYER E VOLUMES SIMPLIFICADOS */
        .player-container {
            max-width: 400px;
            margin: 20px auto;
            background: var(--card-bg);
            border: 2px solid var(--neon-blue);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .vol-controls { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-vol {
            background: var(--silver);
            color: black;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-vol:hover { background: var(--neon-blue); color: white; box-shadow: 0 0 10px var(--neon-blue); }

        /* ANIMAÇÕES */
        @keyframes moveGradient { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

        /* TELAS DE INTRO E ALERTAS */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .copy-alert {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: black; border: 2px solid var(--neon-blue); padding: 20px; z-index: 10000;
            text-align: center; box-shadow: 0 0 50px var(--neon-blue);
        }

        /* RESPONSIVIDADE */
        @media screen and (max-width: 768px) {
            .main-wrapper { flex-direction: column; }
            .nav-container { width: 100%; height: auto; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--neon-blue); }
            .nav-btn { white-space: nowrap; padding: 10px 20px; }
            .nav-hidden .nav-container { display: none; }
        }
    </style>
</head>
<body oncontextmenu="showAlert(); return false;">

    <div id="copyright-alert" class="copy-alert">
        <h3 style="color: var(--neon-blue)">ACESSO PROTEGIDO</h3>
        <p>Propriedade de Gabr (1777777)</p>
    </div>

    <div id="intro-screen">
        <div style="width:200px; height:200px; border:2px solid var(--neon-blue); margin-bottom:20px; border-radius:50%; overflow:hidden; box-shadow: 0 0 30px var(--neon-blue);">
            <img src="https://i.imgur.com/hqDqtpe.gif" style="width:100%; height:100%; object-fit:cover;">
        </div>
        <button onclick="entrarGaleria()" style="padding:15px 40px; background:var(--neon-blue); color:white; border:none; border-radius:30px; font-weight:bold; cursor:pointer; font-size:18px;">ENTRAR NA GALERIA</button>
    </div>

    <div class="perfil-header">
        <h1>GALERIA DE GIFS</h1>
        <p style="color: var(--silver); letter-spacing: 2px;">Gabr (1777777)</p>
    </div>

    <div class="main-wrapper" id="mainWrapper">
        <div class="nav-container">
            <button class="nav-btn active" onclick="showTab('inicio')">Início</button>
            <button class="nav-btn" onclick="showTab('gifs')">GIFS Animados</button>
            <button class="nav-btn" onclick="showTab('pcback-gif')">PCBACK GIFS</button>
            <button class="nav-btn" onclick="showTab('fundos')">Fundos</button>
            <button class="nav-btn" onclick="showTab('player')">Player & Som</button>
        </div>

        <div class="content-area">
            
            <div id="inicio" class="section active">
                <div style="background:var(--card-bg); padding:20px; border-radius:10px; border-left:4px solid var(--neon-blue);">
                    <h3>Bem-vindo</h3>
                    <p>Vendo Gifs, Pcback, Pstyle e Fundos para XAT. DJ nas horas vagas.</p>
                    <p><strong>Married Mnna (1013) ❤️</strong></p>
                </div>
                <h4 style="margin-top:30px; color:var(--neon-blue)">IDs à Venda:</h4>
                <p style="font-family:monospace; font-size:12px; color:var(--silver)">1553333005, 1553333013, 1553333024, 1553333040</p>
            </div>

            <div id="gifs" class="section" style="display:none;">
                <div class="grid-container" id="grid-gifs-container">
                    </div>
            </div>

            <div id="pcback-gif" class="section" style="display:none;">
                <div class="grid-container" id="grid-pcback-container"></div>
            </div>

            <div id="fundos" class="section" style="display:none;">
                <div class="grid-container" id="grid-fundos-container"></div>
            </div>

            <div id="player" class="section" style="display:none;">
                <div class="player-container">
                    <div id="trackName" style="font-weight:bold; color:var(--neon-blue); margin-bottom:15px;">Música: Selecionada</div>
                    <div style="display:flex; justify-content:center; gap:20px;">
                        <button class="btn-vol" onclick="prevTrack()">«</button>
                        <button class="btn-vol" id="playBtn" onclick="togglePlay()">▶</button>
                        <button class="btn-vol" onclick="nextTrack()">»</button>
                    </div>
                    <div class="vol-controls">
                        <button class="btn-vol" onclick="setVolume(0)">0%</button>
                        <button class="btn-vol" onclick="setVolume(0.5)">50%</button>
                        <button class="btn-vol" onclick="setVolume(1)">100%</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="visit-counter">
        <div style="font-size:9px; color:var(--neon-blue); font-weight:bold;">VISITAS</div>
        <div id="count-number" style="font-size:20px; font-family:monospace;">...</div>
    </div>

    <script>
        // Configuração de Mídia
        const playlist = [
            { name: "Alex Warren - Ordinary", url: "https://www.dropbox.com/scl/fi/lpcx92wv63wzcm6z56l7q/Alex-Warren-Ordinary.mp3?rlkey=pdxjo778t66ecrja08pfyij6k&st=zb53k17t&raw=1" },
            { name: "Eminem - You dont know", url: "https://dl.dropboxusercontent.com/scl/fi/4y0lc0fi24e9yavn17psv/Eminem-you-dont-know.mp3?rlkey=zicb6spgqe3pv0gqnz3xc24zo" }
        ];
        let currentTrack = 0;
        const audio = new Audio();
        audio.volume = 0.5;

        // Estrelas no Cursor
        document.addEventListener('mousemove', function(e) {
            const star = document.createElement('div');
            star.classList.add('cursor-star');
            star.style.left = e.pageX + 'px';
            star.style.top = e.pageY + 'px';
            document.body.appendChild(star);
            setTimeout(() => { star.remove(); }, 700);
        });

        // Alerta de Copyright
        function showAlert() {
            const alertBox = document.getElementById('copyright-alert');
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 2000);
        }

        // Entrar e Carregar Contador
        async function entrarGaleria() {
            document.getElementById('intro-screen').style.display = 'none';
            togglePlay();
            try {
                const res = await fetch(`https://api.counterapi.dev/v1/wrs-galeria/wrs_main_2026/up`);
                const data = await res.json();
                document.getElementById('count-number').innerText = data.count || "100";
            } catch(e) { document.getElementById('count-number').innerText = "1250"; }
        }

        // Abas
        function showTab(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            if(window.event) window.event.currentTarget.classList.add('active');
        }

        // Volume Simplificado
        function setVolume(v) {
            audio.volume = v;
        }

        // Player
        function loadTrack(i) { audio.src = playlist[i].url; document.getElementById('trackName').innerText = playlist[i].name; }
        function togglePlay() { if(audio.paused) { if(!audio.src) loadTrack(currentTrack); audio.play(); document.getElementById('playBtn').innerText='||'; } else { audio.pause(); document.getElementById('playBtn').innerText='▶'; } }
        function nextTrack() { currentTrack=(currentTrack+1)%playlist.length; loadTrack(currentTrack); audio.play(); }
        function prevTrack() { currentTrack=(currentTrack-1+playlist.length)%playlist.length; loadTrack(currentTrack); audio.play(); }

        // Renderização de Conteúdo (Garante que os GIFs não travem)
        function renderAll() {
            const gifs = ["bidwh1D", "wR2NpTV", "IMrOUcP", "Hdi04Sg", "OcGaTXA"];
            const pcbacks = ["SFnk7A6", "KKY2zqU", "fmhynyY", "28xDTg0"];
            
            const fill = (containerId, list, label) => {
                const container = document.getElementById(containerId);
                list.forEach((id, i) => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="https://i.imgur.com/${id}.gif">
                            <div class="label">${label} - ${i+1}</div>
                        </div>`;
                });
            };

            fill('grid-gifs-container', gifs, 'GIF');
            fill('grid-pcback-container', pcbacks, 'PCBACK');
        }

        window.onload = renderAll;
    </script>
</body>
</html>
