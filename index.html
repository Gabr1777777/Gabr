<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Status Transparente GABR</title>
    <style>
        /* Estilo Glassmorphism e Neon */
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .status-container {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s ease;
        }

        /* Indicador de luz */
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
            transition: 0.4s;
            box-shadow: 0 0 5px #ff0000;
            background-color: #ff0000; /* Padrão Offline */
        }

        /* Classes de Estado */
        .is-online {
            border-color: rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .is-online .dot {
            background-color: #00f3ff;
            box-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
        }

        .status-text {
            font-size: 14px;
            color: #ff0000;
        }

        .is-online .status-text {
            color: #00f3ff;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="status-card" class="status-container">
        <div id="status-dot" class="dot"></div>
        <span id="status-text" class="status-text">Offline</span>
    </div>

    <script>
        const card = document.getElementById('status-card');
        const text = document.getElementById('status-text');

        // Função para mudar visualmente
        function setStatus(online) {
            if (online) {
                card.classList.add('is-online');
                text.innerText = 'Online';
            } else {
                card.classList.remove('is-online');
                text.innerText = 'Offline';
            }
        }

        // 1. Fica Online ao carregar a página
        window.addEventListener('load', () => {
            setStatus(true);
        });

        // 2. Fica Offline ao fechar a aba ou sair do xat
        window.addEventListener('beforeunload', () => {
            setStatus(false);
        });

        // 3. Opcional: Fica Offline se você minimizar ou mudar de aba
        // Se quiser que fique online mesmo em outra aba, apague as linhas abaixo
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                setStatus(false);
            } else {
                setStatus(true);
            }
        });
    </script>
</body>
</html>
